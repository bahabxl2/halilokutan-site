<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>3D Modern Ev</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0b1020;
  font-family: Arial;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 10;
  display: flex;
  gap: 10px;
}

button {
  padding: 10px 14px;
  border-radius: 8px;
  border: none;
  background: #1e293b;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #334155;
}
</style>
</head>
<body>

<div id="ui">
  <button id="lightBtn">💡 Işık Aç / Kapat</button>
  <button id="fsBtn">⛶ Tam Ekran</button>
</div>

<script type="module">

import * as THREE from "./three.module.js";
import { OrbitControls } from "./OrbitControls.js";

let scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);

let camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(6, 5, 8);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(5, 10, 5);
scene.add(sun);

// Zemin
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x1e293b })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Ev gövde
const house = new THREE.Mesh(
  new THREE.BoxGeometry(4, 2.5, 4),
  new THREE.MeshStandardMaterial({ color: 0xe5e7eb })
);
house.position.y = 1.25;
scene.add(house);

// Çatı
const roof = new THREE.Mesh(
  new THREE.ConeGeometry(3.5, 1.5, 4),
  new THREE.MeshStandardMaterial({ color: 0x991b1b })
);
roof.position.y = 3.25;
roof.rotation.y = Math.PI / 4;
scene.add(roof);

// Pencere
const windowMat = new THREE.MeshStandardMaterial({
  color: 0x60a5fa,
  emissive: 0x000000
});

const win1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.8, 0.8, 0.1),
  windowMat
);
win1.position.set(0, 1.4, 2.01);
scene.add(win1);

let lightsOn = false;

document.getElementById("lightBtn").onclick = () => {
  lightsOn = !lightsOn;
  windowMat.emissive.set(lightsOn ? 0x3399ff : 0x000000);
};

// Tam ekran
document.getElementById("fsBtn").onclick = () => {
  if (!document.fullscreenElement) {
    document.body.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
